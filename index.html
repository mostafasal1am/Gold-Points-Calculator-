<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold & Forex Calculator</title>

<style>
/* ضع هنا محتوى المتغير css بالكامل */
</style>

</head>
<body>

<div id="app">

  <div class="ms-header">
    <div class="ms-logo">
      <div class="ms-logo-icon">⚡</div>
      <div class="ms-logo-text">
        حاسبة الصفقات
        <span>GOLD & FOREX CALCULATOR</span>
      </div>
    </div>

    <div class="ms-badge">XAUUSD</div>
  </div>

  <div class="ms-container">

    <div class="ms-card">

      <div class="ms-card-title">⚙️ إعداد الصفقة</div>

      <div class="ms-trade-type">
        <button id="buyBtn" class="ms-type-btn buy active">
          ▲ شراء — BUY
        </button>

        <button id="sellBtn" class="ms-type-btn sell">
          ▼ بيع — SELL
        </button>
      </div>

      <div class="ms-grid">

        <div class="ms-field">
          <label class="ms-label">📍 سعر الدخول</label>
          <input id="entry" class="ms-input" type="number">
        </div>

        <div class="ms-field">
          <label class="ms-label">🛑 وقف الخسارة</label>
          <input id="sl" class="ms-input" type="number">
        </div>

        <div class="ms-field">
          <label class="ms-label">🎯 الهدف</label>
          <input id="tp" class="ms-input" type="number">
        </div>

        <div class="ms-field">
          <label class="ms-label">📦 اللوت</label>
          <input id="lot" class="ms-input" type="number">
        </div>

      </div>

      <button class="ms-calc-btn" onclick="calculateTrade()">
        ⚡ احسب الصفقة
      </button>

    </div>

    <div id="results"></div>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
